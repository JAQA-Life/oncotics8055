name: Browser AI edition
on:
  push:
    branches: [codex/browser-ai-edition]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-edition-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm run vendor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-model-assets
          path: |
            public_html/assets/browser-ai/
            public_html/scenario-lab/model-worker.mjs*
            package-lock.json
          retention-days: 7
