name: Enhanced browser Scenario Lab full release
on:
  push:
    branches: [codex/browser-simulation-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: node tests/tokenizer-package.check.mjs
      - run: npm test
      - run: node tests/worker-sdk.check.mjs
      - name: Restore verified base weights and inference record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/base-release
          gh release download browser-ai-qwen3b-v1-37613223926 --pattern Oncotics-Hostinger-Upload.zip --pattern BUILD-RESULTS.json --dir work/base-release
          python tools/package-complete-fix.py --restore
      - run: node tools/bundle-worker-hotfix.mjs
      - run: python tools/package-complete-fix.py --manifest
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/worker-fault-browser.mjs
      - run: node tests/research-browser.mjs
      - run: node tests/model-load-browser.mjs
      - run: npm run test:browser
      - run: python tools/package-complete-fix.py
      - name: Publish complete replacement packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "browser-scenario-v2-${GITHUB_RUN_ID}" release/Oncotics-Hostinger-Upload.zip release/Oncotics-Browser-AI-Complete-Project.zip release/HOSTINGER-UPLOAD.md release/BUILD-RESULTS.json release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Oncotics Scenario Lab v2 — complete Qwen 3B browser edition" --notes-file docs/SCENARIO-V2-RELEASE.md
