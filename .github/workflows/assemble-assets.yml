name: Assemble verified imaging models
on:
  push:
    branches: [transfer/model-upload]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'JAQA-Life/oncotics8055' && github.ref == 'refs/heads/transfer/model-upload'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore and verify exact model files
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          records=[{"path":"assets/models/lung-ct-luna16-retinanet/model.onnx","bytes":83668275,"sha256":"aa7d8c246ea0f517fa26dff1f61a61c6cedec0ad00ed56fd87a72b7625778b2f","parts":5},{"path":"assets/models/path-camelyon16-resnet18/model.onnx","bytes":44702485,"sha256":"0b9e194bc0efc8de568adcbc63f07bb9511e98b74c93297c503281b3b11fad99","parts":3}]
          for record in records:
              target=Path(record['path'])
              folder=Path('.github/asset-parts')/target.parent
              parts=sorted(folder.glob(target.name+'.part-*'))
              assert len(parts)==record['parts'], target
              target.parent.mkdir(parents=True,exist_ok=True)
              digest=hashlib.sha256()
              count=0
              with target.open('wb') as output:
                  for part in parts:
                      data=part.read_bytes()
                      digest.update(data)
                      count+=len(data)
                      output.write(data)
              assert count==record['bytes'] and digest.hexdigest()==record['sha256'], target
              print('Verified',target,count,'bytes')
          PY
      - name: Commit full files and remove temporary transfer materials
        run: |
          git rm -r .github/asset-parts .github/workflows/assemble-assets.yml
          git add assets/models
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore verified complete imaging model files'
          git push origin HEAD:transfer/model-upload
