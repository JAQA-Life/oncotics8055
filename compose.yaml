name: oncotics
x-scenario-env: &scenario-env
  SCENARIO_PROXY_SECRET: ${SCENARIO_PROXY_SECRET:?Set SCENARIO_PROXY_SECRET}
  SCENARIO_CSRF_SECRET: ${SCENARIO_CSRF_SECRET:?Set SCENARIO_CSRF_SECRET}
  SCENARIO_PUBLIC_ORIGIN: ${SCENARIO_PUBLIC_ORIGIN:-https://oncotics.com}
  SCENARIO_DATA_DIR: /data/simulation
  EVIDENCE_DIR: /data/evidence
  MIROFISH_LOCAL_URL: http://mirofish-offline:5001
  MIROFISH_CLOUD_URL: http://mirofish-cloud:5001
  ENABLE_LOCAL_ENGINE: ${ENABLE_LOCAL_ENGINE:-true}
  ENABLE_CLOUD_ENGINE: ${ENABLE_CLOUD_ENGINE:-false}
  SCENARIO_TIMEOUT_SECONDS: ${SCENARIO_TIMEOUT_SECONDS:-14400}
  LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:14b}
  LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nomic-embed-text}
  CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL:-}

services:
  oncotics-web:
    build: {context: ., dockerfile: deploy/Dockerfile.web}
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SCENARIO_PROXY_SECRET: ${SCENARIO_PROXY_SECRET:?Set SCENARIO_PROXY_SECRET}
      NGINX_ENVSUBST_FILTER: ^SCENARIO_PROXY_SECRET$
    volumes:
      - ./deploy/auth/htpasswd:/etc/nginx/auth/htpasswd:ro
      - ./deploy/scenario-api.conf.template:/etc/nginx/scenario-api.conf.template:ro
    # The entrypoint renders the API include directly into /etc/nginx.
    command: ["/bin/sh", "-c", "envsubst '$$SCENARIO_PROXY_SECRET' < /etc/nginx/scenario-api.conf.template > /etc/nginx/scenario-api.conf && nginx -g 'daemon off;'"]
    networks: [gateway]
    depends_on: [scenario-api]
    restart: unless-stopped

  scenario-api:
    build: ./services/scenario-orchestrator
    environment: *scenario-env
    volumes: ["scenario-data:/data/simulation", "evidence-data:/data/evidence"]
    networks: [gateway, private-simulation, cloud-egress]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3

  scenario-worker:
    build: ./services/scenario-orchestrator
    command: ["python", "worker.py"]
    environment: *scenario-env
    # Worker cannot write into the authoritative evidence snapshot volume.
    volumes: ["scenario-data:/data/simulation", "evidence-data:/data/evidence:ro"]
    networks: [private-simulation, cloud-egress]
    depends_on: [scenario-api, mirofish-offline]
    restart: unless-stopped

  mirofish-offline:
    build:
      context: .
      dockerfile: deploy/Dockerfile.engine
      args: {ENGINE_DIR: services/mirofish-offline}
    environment:
      FLASK_DEBUG: "false"
      SECRET_KEY: ${LOCAL_ENGINE_SECRET:?Set LOCAL_ENGINE_SECRET}
      LLM_API_KEY: ollama
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL_NAME: ${LOCAL_LLM_MODEL:-qwen2.5:14b}
      OPENAI_API_KEY: ollama
      OPENAI_API_BASE_URL: http://ollama:11434/v1
      EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_BASE_URL: http://ollama:11434
      NEO4J_URI: bolt://neo4j-simulation:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    volumes: ["offline-data:/engine/backend/uploads"]
    networks: [private-simulation]
    depends_on:
      neo4j-simulation: {condition: service_healthy}
      ollama: {condition: service_started}
    restart: unless-stopped

  neo4j-simulation:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
    volumes: ["neo4j-simulation-data:/data", "neo4j-simulation-logs:/logs"]
    networks: [private-simulation]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.8
    volumes: ["local-models:/root/.ollama"]
    networks: [private-simulation]
    restart: unless-stopped

  # Run explicitly to download models, then stop. The running local stack has
  # no internet route, which enforces local model and graph processing.
  local-model-loader:
    image: ollama/ollama:0.6.8
    profiles: [setup]
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & pid=$$!; sleep 5; ollama pull '$${LOCAL_LLM_MODEL}' && ollama pull '$${LOCAL_EMBEDDING_MODEL}'; result=$$?; kill $$pid; exit $$result"]
    environment:
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:14b}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nomic-embed-text}
    volumes: ["local-models:/root/.ollama"]
    networks: [cloud-egress]

  mirofish-cloud:
    profiles: [cloud]
    build:
      context: .
      dockerfile: deploy/Dockerfile.engine
      args: {ENGINE_DIR: services/mirofish-cloud}
    environment:
      FLASK_DEBUG: "false"
      SECRET_KEY: ${CLOUD_ENGINE_SECRET:-}
      LLM_API_KEY: ${CLOUD_LLM_API_KEY:-}
      LLM_BASE_URL: ${CLOUD_LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL_NAME: ${CLOUD_LLM_MODEL:-}
      OPENAI_API_KEY: ${CLOUD_LLM_API_KEY:-}
      OPENAI_API_BASE_URL: ${CLOUD_LLM_BASE_URL:-https://api.openai.com/v1}
      ZEP_API_KEY: ${ZEP_API_KEY:-}
    volumes: ["cloud-data:/engine/backend/uploads"]
    networks: [cloud-egress]
    restart: unless-stopped

networks:
  gateway: {}
  private-simulation: {internal: true}
  cloud-egress: {}
volumes:
  scenario-data: {}
  evidence-data: {}
  offline-data: {}
  cloud-data: {}
  neo4j-simulation-data: {}
  neo4j-simulation-logs: {}
  local-models: {}
